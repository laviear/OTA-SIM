<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>地偶阿宅模拟器：武道馆之约</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        :root {
            --oshi-pink: #E1007E;
            --oshi-light: #FFCCE5;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #0d0d0d; 
            color: white; 
            margin: 0; 
            user-select: none; 
            overflow: hidden; 
        }
        .font-zcool { font-family: 'ZCOOL+KuaiLe', cursive; }
        .font-rash { font-family: 'Ma Shan Zheng', cursive; }
        
        .anime-glow { 
            filter: drop-shadow(0 0 15px rgba(225, 0, 126, 0.6));
        }
        .dream-gradient { 
            background: radial-gradient(circle at center, #2a0a1a 0%, #000000 100%); 
        }
        
        @keyframes idol-float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.03); }
        }
        .idol-animation { animation: idol-float 4s ease-in-out infinite; }
        
        .penlight {
            width: 5px;
            height: 120px;
            border-radius: 10px;
            position: absolute;
            bottom: 0;
            transform-origin: bottom center;
            opacity: 0.8;
            filter: blur(1px);
        }
        
        @keyframes swing {
            from { transform: rotate(-45deg) translateY(0); }
            to { transform: rotate(45deg) translateY(-20px); }
        }
        .swing-anim { animation: swing 0.15s infinite alternate ease-in-out; }

        .cheki-photo {
            background: white;
            padding: 8px 8px 32px 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 2px;
            position: absolute;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .typewriter-text {
            display: inline-block;
            overflow: hidden;
            border-right: 2px solid var(--oshi-pink);
            white-space: nowrap;
            animation: typing 2s steps(30, end), blink .75s step-end infinite;
        }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink { from, to { border-color: transparent } 50% { border-color: var(--oshi-pink); } }

        .btn-disabled {
            background: #333 !important;
            color: #666 !important;
            cursor: not-allowed;
            border-color: #444 !important;
        }
        
        ::-webkit-scrollbar { display: none; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@heroicons/react/": "https://esm.sh/@heroicons/react@^2.2.0/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
